plugins {
    id 'com.android.library'
    id 'maven-publish'
}

version = '1.1.3'

// Fork of intuit/sdp, with two changes that keep it small in the consuming app:
//   - values live on the `fraction` type, not `dimen`, so sdp's 28 buckets don't drag
//     every dimen in the app along with them (~288 KB saved here)
//   - names are zero-padded (_042sdp), so ids sort numerically and the table can stop
//     just past the largest value actually used
// Don't move them back to `dimen` and don't add unpadded aliases.
// src/main/res/values*/ is generated; don't edit by hand. Change unit, positiveMax or
// negativeMax in the createSDP task at the end of this file and run that task to rewrite.

android {
    namespace = "com.intuit.sdp"
    compileSdk = 36

    defaultConfig {
        minSdk = 26
    }

    sourceSets {
        getByName("main") {
            res.srcDirs("src/main/res")
        }
    }

    publishing {
        singleVariant('release')
    }
}

// Published by JitPack from a git tag: com.github.alesimula:murine-sdp:<tag>
// Gradle wrapper is kept in the repo so I can build locally
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.alesimula'
                artifactId = 'murine-sdp'
            }
        }
    }
}

class SDPFactory extends DefaultTask {

    @Input String unit = "dp"
    @Input double positiveMax = 600
    @Input double negativeMax = 60

    @TaskAction
    def create() {
        String resFolder = project.projectDir.path + "/src/main/res/"
        for (double dimen = 300; dimen <= 1080; dimen += 30) {
            String folder = resFolder + "values-sw" + (int) dimen + "dp"
            new File(folder).mkdirs()
            write(folder + "/positive_sdps.xml", 1, (int) positiveMax, dimen, "_%03dsdp", 1)
            write(folder + "/negative_sdps.xml", 1, (int) negativeMax, dimen, "_minus%03dsdp", -1)
        }
        // Baseline bucket: sw300dp values, used when no sw qualifier matches.
        new File(resFolder + "values").mkdirs()
        write(resFolder + "values/positive_sdps.xml", 1, (int) positiveMax, 300, "_%03dsdp", 1)
        write(resFolder + "values/negative_sdps.xml", 1, (int) negativeMax, 300, "_minus%03dsdp", -1)
    }

    private void write(String fileName, int from, int to, double dimen, String namePattern, int sign) {
        PrintWriter w = new PrintWriter(fileName)
        w.println("<?xml version=\"1.0\" encoding=\"utf-8\"?>")
        w.println("<resources>")
        for (int i = from; i <= to; i++) {
            // Custom type, not <dimen>: keeps these out of the app's dimen offset arrays.
            w.printf("\t<item type=\"fraction\" name=\"" + namePattern + "\" format=\"dimension\">%.2f" + unit + "</item>\r\n",
                    i, sign * (i / 300d) * dimen)
        }
        w.println("</resources>")
        w.close()
    }
}

tasks.register('createSDP', SDPFactory) {
    unit = "dp"          // "sp" for a scalable sp unit
    positiveMax = 600    // each value costs 4 bytes x 28 buckets in the consuming app
    negativeMax = 60
}
